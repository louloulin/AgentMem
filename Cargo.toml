# Workspace package configuration
[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["AgentMem Team <team@agentmem.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/louloulin/agentmem"
homepage = "https://www.agentmem.cc"
documentation = "https://docs.rs/agent-mem"
keywords = ["ai", "memory", "agent", "llm", "vector"]
categories = ["database", "science", "web-programming"]

# ⚡ 编译时间优化配置
[profile.release]
# 优化级别：3 = 最高优化
opt-level = 3
# 链接时优化：thin = 平衡性能和编译时间
lto = "thin"
# 代码生成单元：1 = 最慢编译但最好性能（可以改为 16 加快编译）
codegen-units = 16
# 增量编译
incremental = true
# 调试信息：1 = 行号表（足够用于backtrace，但编译更快）
debug = 1
# Strip 符号：减小二进制大小
strip = "debuginfo"

[profile.dev]
# 开发模式优化：0 = 无优化（最快编译）
opt-level = 0
# 开发模式不使用 LTO（加快编译）
lto = false
# 更多代码生成单元（加快增量编译）
codegen-units = 256
# 增量编译
incremental = true
# 保留完整调试信息
debug = 2

[profile.dev.package."*"]
# 依赖项使用一些优化（不花太多时间编译依赖）
opt-level = 1

# ⚡ 测试配置优化
[profile.test]
opt-level = 1
debug = 2
codegen-units = 16
lto = false
incremental = true

# ⚡ Bench 配置优化
[profile.bench]
opt-level = 3
debug = 1
codegen-units = 1
lto = "thin"
incremental = false

# 📦 依赖优化
[workspace.dependencies]
# 固定版本以避免重复解析
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3.8"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
toml = "0.8"
config = "0.14"
num_cpus = "1.16"
rand = "0.8"
dashmap = "5.5"
reqwest = { version = "0.11", features = ["json"] }
hyper = { version = "0.14", features = ["full"] }
tower = "0.4"
axum = "0.7"
bytes = "1.5"
parking_lot = "0.12"
crossbeam = "0.8"
once_cell = "1.19"
