[package]
name = "agent-mem-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core memory management for AgentMem memory platform"

[dependencies]
# Core dependencies
agent-mem-traits = { path = "../agent-mem-traits" }
agent-mem-utils = { path = "../agent-mem-utils" }
agent-mem-config = { path = "../agent-mem-config" }
agent-mem-storage = { path = "../agent-mem-storage" }
agent-mem-types = { path = "../agent-mem-types" }

# Optional modular crates (extracted from this crate)
agent-mem-engine = { path = "../agent-mem-engine", optional = true }
agent-mem-search = { path = "../agent-mem-search", optional = true }
agent-mem-cognitive = { path = "../agent-mem-cognitive", optional = true }

# Optional integrations
agent-mem-llm = { path = "../agent-mem-llm" }
agent-mem-tools = { path = "../agent-mem-tools" }

# Core dependencies
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
uuid.workspace = true
chrono.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log = "0.4"
lru = "0.12"
parking_lot.workspace = true
lazy_static = "1.4"

# Storage and async
async-trait.workspace = true
tracing.workspace = true
futures = "0.3"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
rand_distr = "0.4"
regex = "1.10"
bincode = "1.3"
md5 = "0.7"
toml = "0.8"
validator = { version = "0.18", features = ["derive"] }

# Database dependencies
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"], optional = true }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"], optional = true }
libsql = { version = "0.9", optional = true }
base64 = "0.22.1"

[dev-dependencies]
tempfile.workspace = true
tokio-test = "0.4"
agent-mem-storage = { path = "../agent-mem-storage", features = ["memory"] }
agent-mem = { path = "../agent-mem" }
criterion.workspace = true

[[example]]
name = "phase2_demo"
path = "examples/phase2_demo.rs"

[features]
# Default: LibSQL + modular crates (all enabled)
default = ["libsql", "engine", "search", "cognitive"]

# Modular features (extracted from this crate)
engine = ["dep:agent-mem-engine"]
search = ["dep:agent-mem-search"]
cognitive = ["dep:agent-mem-cognitive"]

# Database features
persistence = ["postgres", "redis-cache"]
vector-search = []
postgres = ["sqlx", "agent-mem-traits/sqlx"]
redis-cache = ["redis"]
libsql = ["dep:libsql"]

# Optional integrations

# Testing and development
inline_tests = []
performance_tests = []

[[bench]]
name = "memory_operations"
harness = false
