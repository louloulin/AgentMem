[package]
name = "agent-mem"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified Memory API for AgentMem"

[dependencies]
# Core dependencies
agent-mem-traits = { path = "../agent-mem-traits" }
agent-mem-core = { path = "../agent-mem-core" }
agent-mem-llm = { path = "../agent-mem-llm" }
agent-mem-storage = { path = "../agent-mem-storage" }
agent-mem-config = { path = "../agent-mem-config" }
agent-mem-utils = { path = "../agent-mem-utils" }

# Memory hierarchy (from agent-mem-cognitive)
agent-mem-cognitive = { path = "../agent-mem-cognitive" }

# Optional dependencies
agent-mem-plugins = { path = "../agent-mem-plugins", optional = true }
agent-mem-forgetting = { path = "../agent-mem-forgetting", optional = true }
agent-mem-event-bus = { path = "../agent-mem-event-bus", optional = true }

# Async and serialization
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
anyhow.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber.workspace = true
tempfile.workspace = true

[[bench]]
name = "memory_benchmarks"
harness = false

[features]
default = []
plugins = ["dep:agent-mem-plugins"]
forgetting = ["dep:agent-mem-forgetting"]
events = ["dep:agent-mem-event-bus"]
